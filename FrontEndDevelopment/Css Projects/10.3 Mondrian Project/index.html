<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .grid-container{
      height: 748px;
      width: 748px;
      grid-template: 414px 130px 157px 20px/ 320px 198px 153px 50px;
      display: grid;
      gap: 9px;
      background-color: black;
    }

    .grid-item-2{
      grid-area: 1 / 2 / 2 / -1;
    }
    .grid-item-2{
      grid-area: 1 / 2 / 2 / -1;
    }
    .grid-item-3{
      grid-area: 2 / 1 / 4 / 2;
    }
    .grid-item-4{
      grid-area: 2 / 2 / 4 / 4;
    }
    .grid-item-6{
      grid-area: -3 / -2 / -1 / -1;
    }
    .White{
      background-color: #F0F1EC ;
    } 
    .Red{
      background-color: #E72F24 ;
    } 
    .Black{
      background-color: #232629 ;
    } 
    .Blue{
      background-color: #004592 ;
      border-bottom: 1px solid black;
      grid-area: 2 / -2 / 3 / -1;
    } 
    .Yellow{
      background-color: #F9D01E ;
    } 
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="grid-container">
      <div class="grid-item-1 Red"></div>
      <div class="grid-item-2 White"></div>
      <div class="grid-item-3 White"></div>
      <div class="grid-item-4 White"></div>
      <div class="grid-item-5 Blue"></div>
      <div class="grid-item-6 White"></div>
      <div class="grid-item-7 White"></div>
      <div class="grid-item-8 Black"></div>
      <div class="grid-item-9 Yellow"></div>
    </div>
</body>

</html>
